<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - TVVALENAREDE</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: #ffffff;
            padding: 25px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        textarea {
            resize: none;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            background: #0077ff;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #005dcc;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Formulário de Contato</h2>

        <form action="https://app.formgrid.com/forms/NZ1A3OrujXAlZIgE/submit" method="POST">
            
            <label>Nome:</label>
            <input type="text" name="nome" required>

            <label>E-mail:</label>
            <input type="email" name="email" required>

            <label>Mensagem (até 7 linhas):</label>
            <textarea name="mensagem" rows="7" required></textarea>

            <button type="submit">Enviar Mensagem</button>
        </form>
    </div>

    <footer>
        © TVVALENAREDE
    </footer>

</body>
</html>

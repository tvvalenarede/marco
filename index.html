<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário TVVALENAREDE</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 30px;
        }
        form {
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 0 10px #ccc;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }
        button {
            background: #007bff;
            color: white;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 5px;
            width: 100%;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .success, .error {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background: #c8ffc8;
            color: #006600;
        }
        .error {
            background: #ffc8c8;
            color: #660000;
        }
    </style>
</head>

<body>

<form id="contact-form">
    <h2>Enviar Mensagem</h2>

    <!-- Web3Forms Required -->
    <input type="hidden" name="access_key" value="60460a16-e367-417f-9f2d-c79c400867c0">

    <label>Seu Nome:</label>
    <input type="text" name="name" required>

    <label>Seu E-mail:</label>
    <input type="email" name="email" required>

    <label>Mensagem:</label>
    <textarea name="message" rows="5" required></textarea>

    <button type="submit">Enviar</button>

    <div class="success">Mensagem enviada com sucesso!</div>
    <div class="error">Ocorreu um erro ao enviar.</div>
</form>

<script>
document.getElementById("contact-form").addEventListener("submit", async function(e){
    e.preventDefault();

    const form = e.target;
    const data = new FormData(form);

    const response = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        body: data
    });

    if(response.ok){
        form.querySelector(".success").style.display = "block";
        form.querySelector(".error").style.display = "none";
        form.reset();
    } else {
        form.querySelector(".success").style.display = "none";
        form.querySelector(".error").style.display = "block";
    }
});
</script>

</body>
</html>

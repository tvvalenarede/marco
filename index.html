<!-- Coloque dentro do <head> ou antes do fechamento do </body> -->
<!-- SDK do EmailJS -->
<script src="https://cdn.emailjs.com/sdk/3.2.0/email.min.js"></script>

<!-- Formulário -->
<form id="contact-form">
  <label>Nome</label>
  <input type="text" name="from_name" required />

  <label>E-mail</label>
  <input type="email" name="from_email" required />

  <label>Telefone</label>
  <input type="text" name="phone" />

  <label>Mensagem</label>
  <textarea name="message" required></textarea>

  <button type="submit">Enviar</button>
</form>

<!-- Feedback simples -->
<div id="form-status" style="margin-top:10px;"></div>

<script>
  // Inicializa o EmailJS com sua Public Key
  (function(){
    emailjs.init('V1Lqa3krlPgX3vqr9'); // sua Public Key
  })();

  // IDs (já informados por você)
  const SERVICE_ID = 'service_1jk3ebe';
  const TEMPLATE_ID = 'template_zyp8f5k';
  const PUBLIC_KEY = 'V1Lqa3krlPgX3vqr9';

  const form = document.getElementById('contact-form');
  const statusEl = document.getElementById('form-status');

  form.addEventListener('submit', function(event) {
    event.preventDefault();
    statusEl.textContent = 'Enviando...';

    // envia usando sendForm (puxa os campos do <form>)
    emailjs.sendForm(SERVICE_ID, TEMPLATE_ID, this, PUBLIC_KEY)
      .then(function(response) {
        console.log('SUCESSO!', response.status, response.text);
        statusEl.textContent = 'Mensagem enviada com sucesso. Obrigado!';
        form.reset();
      }, function(error) {
        console.error('ERRO...', error);
        statusEl.innerHTML = 'Erro ao enviar. Veja o console para detalhes.<br>Se necessário, cheque o painel do EmailJS.';
      });
  });
</script>
